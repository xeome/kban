<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Three columns on the board's ground, one card in progress in the warm status colour.
       Every edge sits on a 2-unit grid, so it stays crisp at 16px. -->
  <rect x=".5" y=".5" width="31" height="31" rx="7.5" fill="#151618" stroke="#FFFFFF" stroke-opacity=".14"/>
  <g fill="#E6E7EA">
    <rect x="6" y="6" width="4" height="20" rx="1"/>
    <rect x="14" y="12" width="4" height="6" rx="1"/>
    <rect x="22" y="6" width="4" height="6" rx="1"/>
  </g>
  <rect x="14" y="6" width="4" height="4" rx="1" fill="#E5AE52"/>
</svg>
