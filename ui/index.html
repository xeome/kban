<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kban</title>
<link rel="stylesheet" href="app.css">
<div class="panel">
<header>
  <span id="file"></span>
  <span id="status"></span>
  <button id="theme" title="Switch theme" aria-label="Switch theme"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11A5.5 5.5 0 0 0 8 2.5z" fill="currentColor"/></svg></button>
</header>
<div id="problem" role="alert" hidden></div>
<textarea id="note" rows="1" spellcheck="false" readonly placeholder="Instructions for you and your agents — kept at the top of the file"></textarea>
<main id="board"></main>
<footer>
  <span>Click a card to open it, drag to move it. Keys:</span>
  <span><kbd>↑↓←→</kbd> select</span>
  <span><kbd>⏎</kbd> open</span>
  <span><kbd>n</kbd> new card</span>
  <span><kbd>x</kbd> delete</span>
  <span><kbd>⇧</kbd>+arrows move</span>
  <span><kbd>u</kbd> undo</span>
  <span><kbd>+</kbd> column</span>
</footer>
</div>

<dialog id="card" aria-labelledby="card-title" tabindex="-1" autofocus>
  <header>
    <span id="card-where"></span>
    <button class="icon" id="card-prev" title="Previous card (Ctrl+↑)" aria-label="Previous card"><svg viewBox="0 0 16 16"><path d="M4.5 10l3.5-3.5 3.5 3.5"/></svg></button>
    <button class="icon" id="card-next" title="Next card (Ctrl+↓)" aria-label="Next card"><svg viewBox="0 0 16 16"><path d="M4.5 6l3.5 3.5 3.5-3.5"/></svg></button>
    <button class="icon" id="card-close" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7m0-7l-7 7"/></svg></button>
  </header>
  <div class="card-body">
    <div class="card-main">
      <input id="card-title" placeholder="Title" spellcheck="false" autocomplete="off">
      <textarea id="card-notes" rows="3" placeholder="Add notes"></textarea>
      <section class="thread" aria-label="Comments">
        <h3>Comments <span id="card-count"></span></h3>
        <ol id="card-comments"></ol>
        <div class="composer">
          <textarea id="card-draft" rows="2" placeholder="Write a comment"></textarea>
          <div class="composer-row">
            <span class="hint"><kbd>Ctrl</kbd> <kbd>⏎</kbd> to post · <kbd>c</kbd> to write · <kbd>Ctrl</kbd> <kbd>↑↓</kbd> next card</span>
            <button class="btn primary" id="card-post" disabled>Comment</button>
          </div>
        </div>
      </section>
    </div>
    <aside class="card-side">
      <h3>Column</h3>
      <div id="card-cols"></div>
      <button class="btn danger" id="card-delete">Delete card</button>
    </aside>
  </div>
</dialog>
<script src="app.js"></script>
