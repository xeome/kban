<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kban</title>
<link rel="stylesheet" href="app.css">
<header>
  <span id="file"></span>
  <span id="status"></span>
</header>
<main id="board"></main>
<footer>
  <span>Click a card to edit it, drag to move it. Keys:</span>
  <span><kbd>↑↓←→</kbd> select</span>
  <span><kbd>⏎</kbd> edit</span>
  <span><kbd>n</kbd> new card</span>
  <span><kbd>x</kbd> delete</span>
  <span><kbd>⇧</kbd>+arrows move</span>
  <span><kbd>u</kbd> undo</span>
  <span><kbd>+</kbd> column</span>
</footer>
<script src="app.js"></script>
