<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kban</title>
<link rel="stylesheet" href="app.css">
<div class="panel">
<header>
  <span id="file"></span>
  <span id="status"></span>
  <button id="theme" title="Switch theme" aria-label="Switch theme"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11A5.5 5.5 0 0 0 8 2.5z" fill="currentColor"/></svg></button>
</header>
<textarea id="note" rows="1" spellcheck="false" placeholder="Notes for you and your agents — kept above the board, in the file"></textarea>
<main id="board"></main>
<footer>
  <span>Click a card to edit it, drag to move it. Keys:</span>
  <span><kbd>↑↓←→</kbd> select</span>
  <span><kbd>⏎</kbd> edit</span>
  <span><kbd>n</kbd> new card</span>
  <span><kbd>x</kbd> delete</span>
  <span><kbd>⇧</kbd>+arrows move</span>
  <span><kbd>u</kbd> undo</span>
  <span><kbd>+</kbd> column</span>
</footer>
</div>
<script src="app.js"></script>
