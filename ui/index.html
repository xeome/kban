<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kban</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<nav id="side" aria-label="Projects">
  <div class="top"><button id="fold" class="item tip"><svg viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M6.5 3v10"/></svg></button></div>
  <div id="groups"></div>
</nav>
<script>try { if (localStorage.side === 'rail') document.getElementById('side').classList.add('rail'); } catch {}</script>
<div class="panel">
<header>
  <span id="file"></span>
  <span id="status"></span>
  <button id="theme" title="Switch theme" aria-label="Switch theme"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11A5.5 5.5 0 0 0 8 2.5z" fill="currentColor"/></svg></button>
</header>
<nav id="tabs" class="scroll" aria-label="Boards and sessions"></nav>
<div id="problem" role="alert" hidden></div>
<textarea id="note" rows="1" spellcheck="false" readonly placeholder="Instructions for you and your agents — kept at the top of the file"></textarea>
<main id="board"></main>
<div id="session"><nav id="list" class="sessions" aria-label="Sessions"></nav><div id="sess"></div></div>
<footer>
  <span>Click a card to open it, drag to move it. Keys:</span>
  <span><kbd>↑↓←→</kbd> select</span>
  <span><kbd>⏎</kbd> open</span>
  <span><kbd>n</kbd> new card</span>
  <span><kbd>x</kbd> delete</span>
  <span><kbd>⇧</kbd>+arrows move</span>
  <span><kbd>u</kbd> undo</span>
  <span><kbd>+</kbd> column</span>
  <span><kbd>[</kbd> sidebar</span>
</footer>
</div>

<dialog id="card" aria-labelledby="card-title" tabindex="-1" autofocus></dialog>
<script src="/app.js"></script>
